<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Voice Translator</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f7f6; margin: 0; padding: 15px; }
        .main-container { max-width: 1100px; margin: 0 auto; }
        h1 { text-align: center; color: #2c3e50; font-size: 24px; }
        
        .input-section { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); margin-bottom: 25px; }
        textarea { width: 100%; height: 110px; padding: 15px; border: 2px solid #ddd; border-radius: 10px; font-size: 16px; box-sizing: border-box; outline: none; transition: 0.3s; resize: none; }
        textarea:focus { border-color: #3498db; }
        
        button#mainBtn { width: 100%; padding: 15px; background: #3498db; color: white; border: none; border-radius: 10px; font-size: 18px; cursor: pointer; margin-top: 10px; font-weight: bold; }
        button#mainBtn:active { transform: scale(0.98); }

        .results-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; }

        .lang-card { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); position: relative; border-bottom: 6px solid #ddd; }
        .lang-card h3 { margin: 0 0 10px 0; font-size: 18px; display: flex; justify-content: space-between; align-items: center; }
        
        .output { font-size: 17px; color: #333; min-height: 60px; line-height: 1.5; margin-bottom: 15px; }
        
        .speak-btn { background: #f0f0f0; border: none; padding: 8px 12px; border-radius: 20px; cursor: pointer; font-size: 14px; transition: 0.2s; }
        .speak-btn:hover { background: #e0e0e0; }

        /* Ranglar */
        .en { border-color: #3498db; } .uz { border-color: #2ecc71; }
        .ru { border-color: #e74c3c; } .ja { border-color: #f1c40f; }
    </style>
</head>
<body>

<div class="main-container">
    <h1>🌍 Smart Multi-Translator</h1>
    
    <div class="input-section">
        <textarea id="sourceText" placeholder="Matnni kiriting... (Masalan: Bugun havo juda chiroyli)"></textarea>
        <button id="mainBtn" onclick="translateAll()">Tarjima va Tayyorlash</button>
    </div>

    <div class="results-grid">
        <div class="lang-card en">
            <h3>English 🇺🇸 <button class="speak-btn" onclick="speak('out_en', 'en-US')">🔊 Tinglash</button></h3>
            <div id="out_en" class="output">...</div>
        </div>
        <div class="lang-card uz">
            <h3>O'zbekcha 🇺🇿 <button class="speak-btn" onclick="speak('out_uz', 'tr-TR')">🔊 Tinglash</button></h3>
            <div id="out_uz" class="output">...</div>
        </div>
        <div class="lang-card ru">
            <h3>Русский 🇷🇺 <button class="speak-btn" onclick="speak('out_ru', 'ru-RU')">🔊 Tinglash</button></h3>
            <div id="out_ru" class="output">...</div>
        </div>
        <div class="lang-card ja">
            <h3>日本語 🇯🇵 <button class="speak-btn" onclick="speak('out_ja', 'ja-JP')">🔊 Tinglash</button></h3>
            <div id="out_ja" class="output">...</div>
        </div>
    </div>
</div>

<script>
    // Tarjima funksiyasi
    async function translateSingle(text, target) {
        try {
            const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=${target}&dt=t&q=${encodeURI(text)}`;
            const res = await fetch(url);
            const data = await res.json();
            return data[0][0][0];
        } catch (e) { return "Xatolik!"; }
    }

    async function translateAll() {
        const text = document.getElementById('sourceText').value;
        if (!text) return alert("Matn kiriting!");

        const ids = ['out_en', 'out_uz', 'out_ru', 'out_ja'];
        ids.forEach(id => document.getElementById(id).innerText = "⏳...");

        const [en, uz, ru, ja] = await Promise.all([
            translateSingle(text, 'en'),
            translateSingle(text, 'uz'),
            translateSingle(text, 'ru'),
            translateSingle(text, 'ja')
        ]);

        document.getElementById('out_en').innerText = en;
        document.getElementById('out_uz').innerText = uz;
        document.getElementById('out_ru').innerText = ru;
        document.getElementById('out_ja').innerText = ja;
    }

    // Ovozli o'qish funksiyasi
    function speak(elementId, langCode) {
        const text = document.getElementById(elementId).innerText;
        if (text === "..." || text === "⏳...") return;

        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = langCode;
        utterance.rate = 0.9; // Tezligi
        window.speechSynthesis.speak(utterance);
    }
</script>

</body>
</html>
